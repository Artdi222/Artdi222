name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Artdi222
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=6a7294&color_dots=#ebedf0,#dddded,#b9bde6,#9397b5,#6a7294
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ecebf2&color_dots=#161b22,#2f3142,#4f5266,#787ac7,#b9bde6

      - name: Push snake animation to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "Update snake animation [skip ci]"
